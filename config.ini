; =============================================================================
; HVAC PROJECT CONFIGURATION FILE - PORTABLE VERSION
; =============================================================================
; 
;  QUICK START - CHANGE ONLY THESE 4 VARIABLES:
; =============================================================================
; 1. building_id = C1
; 2. ahu_unit = UTA1
; 3. season = Summer or Winter (Title Case)
; 4. year = 2025 or 2026
;t
; Everything else updates AUTOMATICALLY!
; =============================================================================

; =============================================================================
; SYSTEM REQUIREMENTS
; =============================================================================
[system_requirements]
os = Windows 10/11 (or compatible Linux/macOS)
python_version = 3.12
python_minimum = 3.10
python_maximum = 3.12
ide = VS Code with Python extension
terminal = PowerShell (Windows) or Bash (Linux/macOS)

; =============================================================================
; PYTHON DEPENDENCIES
; =============================================================================
[python_packages]
; Core data processing and analysis
pandas = >=2.2
numpy = >=1.26
python-dateutil = >=2.8
pytz = >=2024.1

; Visualization libraries
matplotlib = >=3.8
seaborn = >=0.13

; Statistical analysis
scipy = >=1.12

; Machine learning (Standard)
scikit-learn = >=1.3
xgboost = >=2.0

; Deep Learning (LSTM/Neural Networks)
tensorflow = >=2.15

; Hyperparameter Optimisation
optuna = >=3.5
optuna-integration = >=3.5

; Report generation
python-docx = >=1.1
openpyxl = >=3.0

; Utility libraries
tqdm = >=4.66
psutil = >=5.9

; =============================================================================
; GLOBAL SETTINGS
; =============================================================================
[global]
; --- CHANGE ONLY THESE 4 VARIABLES ---
building_id = C1
ahu_unit = UTA1
season = Summer
year = 2025

; Timezone for timestamp parsing
timezone = Europe/Rome

; =============================================================================
; SEASONAL DATE RANGES (AUTO-SELECTED)
; =============================================================================
[seasonal_presets]
; -----------------------------------------------------------------------------
; SEASONAL DATE CONVENTION
; -----------------------------------------------------------------------------
; For any year n:
;    Summer(n) = April 15 (year n-1)  October 14 (year n-1)
;    Winter(n) = October 15 (year n-1)  April 15 (year n)
; -----------------------------------------------------------------------------

; SEASONAL DATE RANGES
; 
; Convention:
;   Summer(n) = April 15 (year n)  October 14 (year n)
;   Winter(n) = October 15 (year n-1)  April 15 (year n)
; 

; Summer 2024: Apr 15, 2024  Oct 14, 2024
summer_start_2024 = 2024-04-15
summer_end_2024 = 2024-10-14

; Winter 2025: Oct 15, 2024  Apr 15, 2025
winter_start_2025 = 2024-10-15
winter_end_2025 = 2025-04-15

; Summer 2025: July 9, 2025  Oct 14, 2025
summer_start_2025 = 2025-07-09
summer_end_2025 = 2025-10-14

; Winter 2026: Oct 15, 2025  Feb 18, 2026
winter_start_2026 = 2025-10-15
winter_end_2026 = 2026-02-18

; =============================================================================
; FILE PATHS - PORTABLE CONFIGURATION
; =============================================================================
[paths]
base_folder = ./data
processed_folder = ./processed_data
plots_folder = ./plots
output_folder = ./output/results
merged_folder = merged
interpolation_folder = interpolation

; AUTO-GENERATED: Input CSV file pattern
input_csv = ${global:building_id}_${global:ahu_unit}_${global:season}${global:year}.csv

; =============================================================================
; WEATHER DATA - DYNAMIC SELECTION
; =============================================================================
[weather]
file_path = LIMF_from_2025-07-01_to_2026-02-18.csv
time_column = timestamp
temp_column = temp
humidity_column = rh

; =============================================================================
; DATA MERGING
; =============================================================================
[merging]
enable_merge = true
weather_csv_name = ${weather:file_path}
weather_time_column = timestamp
main_time_column = Time
weather_columns_to_add = temp, rh
merge_tolerance_hours = 0.5

; =============================================================================
; WEATHER GAP-FILLING DEFAULTS
; =============================================================================
[weather_defaults]
seasonal_temps = 1:3, 2:7, 3:12, 4:16, 5:20, 6:24, 7:27, 8:26, 9:22, 10:17, 11:10, 12:5
default_humidity = 60.0
forward_fill_limit = 6

; =============================================================================
; PHYSICAL THRESHOLDS
; =============================================================================
[physical_thresholds]
Temperatura Ripresa = 10, 40
Temperatura Mandata = 10, 40
Temperatura Saturazione = 10, 40
Set Points Temperatura Mandata = 15, 21
Set Points Temperatura Compensata = 15, 21
Temperatura Esterna = -10, 45
Modulazione Ventilatore Ripresa = 0, 100
Modulazione Ventilatore Mandata = 0, 100
Umidita Esterna = 0, 100

; =============================================================================
; SEASONAL PHYSICAL THRESHOLDS (Override base thresholds by season)
; =============================================================================
; resolve_physical_thresholds() in 4.outlier_detection.py checks these FIRST.
; Use them to apply season-specific setpoint limits that differ from base values.
[physical_thresholds_summer]
Set Points Temperatura Mandata = 15, 22
Set Points Temperatura Compensata = 15, 22

[physical_thresholds_winter]
Set Points Temperatura Mandata = 15, 30
Set Points Temperatura Compensata = 15, 30

; =============================================================================
; COLUMN DISPLAY NAMES (ITALIAN)
; =============================================================================
; Used by 1.merged_data.py to rename abbreviated CSV column names to full
; Italian display names after merging. All downstream scripts expect full names.
[column_display_names]
; Map actual CSV column names (left)  full Italian display names (right)
Temp. Ripresa = Temperatura Ripresa
Temp. Mandata = Temperatura Mandata
Temp. Saturazione = Temperatura Saturazione
Mod. V. Ripresa = Modulazione Ventilatore Ripresa
Mod. V. Mandata = Modulazione Ventilatore Mandata
SP Temp. Mand. = Set Points Temperatura Mandata
SP Temp. Mand. Comp. = Set Points Temperatura Compensata
Temp. Esterna = Temperatura Esterna
Umid. Esterna = Umidita Esterna

; =============================================================================
; DATA LOADING SETTINGS
; =============================================================================
[data]
;    CRITICAL: Set skiprows based on your CSV format
;    - skiprows = 0: Use when CSV has NO sep=; header line (normal CSV)
;    - skiprows = 1: Use when CSV has sep=; or sep=, as first line
;    Example:
;      Summer 2025 file: No sep line  skiprows = 0
;      Winter 2026 file: Has "sep=," line  skiprows = 1
;    Wrong value will skip your header row and break column parsing!
skiprows = 0
csv_sep = auto
encoding = utf-8-sig
decimal = dot
time_column = Time
temperature_columns = Temperatura Ripresa, Temperatura Mandata, Temperatura Saturazione, Set Points Temperatura Mandata, Set Points Temperatura Compensata, Temperatura Esterna
modulation_columns = Modulazione Ventilatore Ripresa, Modulazione Ventilatore Mandata
humidity_columns = Umidita Esterna
start_date = 
end_date = 

; =============================================================================
; MISSING DATA DETECTION
; =============================================================================
[missing_data]
detect_missing_periods = 1
max_missing_hours = 4
missing_threshold_hours = 4
target_column_for_missing = Temperatura Ripresa, Temperatura Mandata, Temperatura Saturazione, Set Points Temperatura Mandata, Set Points Temperatura Compensata, Temperatura Esterna, Umidita Esterna
create_missing_data_plots = 1
save_missing_data_report = 1

; =============================================================================
; RESAMPLING
; =============================================================================
[resampling]
resample = 1
frequency = 30min

; =============================================================================
; PROCESSING (Compatibility Layer)
; =============================================================================
;    IMPORTANT: Some scripts may look for [processing] instead of [resampling]
; This section provides backward compatibility to prevent silent failures
[processing]
resample_freq = ${resampling:frequency}

; =============================================================================
; INTERPOLATION
; =============================================================================
[interpolation]
columns_to_process = Temperatura Ripresa, Temperatura Mandata, Temperatura Saturazione, Set Points Temperatura Mandata, Set Points Temperatura Compensata, Modulazione Ventilatore Ripresa, Modulazione Ventilatore Mandata, Temperatura Esterna, Umidita Esterna
sensor_method = time
setpoint_method = ffill
max_gap_hours = 4

; =============================================================================
; OUTLIER DETECTION - METHOD SELECTION GUIDE
; =============================================================================
;  CRITICAL: Choose the RIGHT method for each data type
; =============================================================================
; 
;  SENSOR DATA (Temperatures, Humidity, Pressures):
;     Physical Limits: YES (min/max based on physics)
;     IQR Method: YES (detects statistical anomalies)
;     Valid States: NO (sensors are continuous, not discrete)
;    Example: Temperatura Ripresa, Temperatura Mandata, Umidita Esterna
;
;  SETPOINT DATA (Control targets):
;     Physical Limits: YES (reasonable operating range)
;     IQR Method: NO (setpoints change in steps  flags normal control)
;     Valid States: MAYBE (only if discrete step control)
;     Better: Rate-of-change detection (flag sudden jumps)
;    Example: Set Points Temperatura Mandata
;
;  FAN MODULATION (0-100%):
;     Physical Limits: YES (0-100%)
;     IQR Method: NO (often discrete or staged control)
;     Valid States: ONLY IF DISCRETE (0%, 20%, 50%, 70%, 80%)
;     If continuous (43.2%, 67.8%): Use range + rate-of-change instead
;     Better alternatives:
;      - Stuck/frozen detection (same value for > 6 hours)
;      - Jump detection (change > 30% in 1 step)
;    Example: Modulazione Ventilatore Ripresa/Mandata
;
;  BEFORE ENABLING valid_states:
;    Run: df['Modulazione Ventilatore Ripresa'].value_counts().head(20)
;     See only 5-10 unique values?  Discrete  valid_states OK
;     See hundreds of unique values?  Continuous  DO NOT use valid_states
;
; =============================================================================

[outlier_detection]
enable_physical_limits = 1
enable_iqr = 1
enable_valid_states = 1
iqr_multiplier = 3.5

; IQR columns: CONSERVATIVE - Only stable sensors with single-regime distributions
; -----------------------------------------------------------------------------
; Paper 17 AFDD Approach: IQR is NOT for multi-regime or building-dependent data
; Use IQR ONLY for sensor noise detection in naturally stable measurements
;
;  KEEP (stable, single distribution):
;     Temperatura Saturazione: Coil sensor, stable during operation
;     Temperatura Esterna: Weather data, stable distribution per season
;     Umidita Esterna: Weather data, detects sensor/station errors
;
;  REMOVED (multi-regime, building-dependent):
;     Temperatura Mandata: Control output, varies by heating/cooling mode
;     Temperatura Ripresa: Building-dependent, varies by occupancy/usage
;
; For removed columns, use instead:
;     Physical bounds (min/max plausibility)
;     Spike detection (rate-of-change > threshold)
;     Stuck sensor (flatline > 6 hours)
; -----------------------------------------------------------------------------
iqr_columns = Temperatura Saturazione, Temperatura Esterna, Umidita Esterna

;    CRITICAL: Valid States for Fan Modulation
; =============================================================================
; WARNING: "Valid states" assumes DISCRETE step control (e.g., 0%, 20%, 50%)
;          If your BMS uses CONTINUOUS modulation (e.g., 43.2%, 67.8%),
;          this method will incorrectly flag valid points as outliers!
;
;  FIXED (Fix C): Disabled valid_states for fans (likely continuous VFD control)
; Better alternatives for continuous modulation:
;    Physical bounds (0-100%)
;    Spike detection (max jump > 30% per 30min)
;    Stuck sensor (flatline for > 6 hours)
;
; If you confirm discrete control (value_counts shows only 5-10 unique values),
; uncomment these lines:
; Modulazione Ventilatore Ripresa_valid_states = 0.0, 20, 50, 70, 80
; Modulazione Ventilatore Mandata_valid_states = 0.0, 30, 40, 60, 80
; valid_states_columns = Modulazione Ventilatore Ripresa, Modulazione Ventilatore Mandata
; =============================================================================
valid_states_columns =
valid_states_tolerance = 0.5
drop_threshold_percentage = 10
create_outlier_plots = 1
save_outlier_reports = 1

; =============================================================================
; FEATURE ENGINEERING - OPTIMIZED CONFIGURATION
; =============================================================================
[feature_engineering]
enable_feature_engineering = true
feature_set = custom

; =============================================================================
; AUTOMATED SEASONAL FEATURE SELECTION
; =============================================================================
; The Python script automatically picks the correct list
; based on the 'season' variable in [global] section.

; SUMMER FEATURES (Cooling-focused)
; Rationale: 
; 1. thermal_power_signed: Main cooling load metric (Fan x T)
; 2. Umidita Esterna: CRITICAL in summer (latent heat drives AC)
; 3. outdoor_temp_rolling_3h: Smoothed outdoor temp (better than raw)
; 4. setpoint_error: Shows control quality & AC struggles
custom_features_summer = thermal_power_signed, Umidita Esterna, outdoor_temp_rolling_3h, setpoint_error

; WINTER FEATURES (Heating-focused)
; Rationale:
; 1. thermal_power_signed: Main heating load metric
; 2. outdoor_temp_rolling_3h: Primary heating driver
; 3. Temperatura Mandata: Shows active heating vs ventilation
; 4. setpoint_error: Shows control quality
; Note: Humidity removed (low impact on heating load)
custom_features_winter = thermal_power_signed, outdoor_temp_rolling_3h, Temperatura Mandata, setpoint_error

; =============================================================================
; FEATURE CREATION SETTINGS
; =============================================================================

; Temperature difference features
create_delta_t = true
create_delta_t_signed = true

; Occupancy features
occupancy_weekdays = Mon-Fri
occupancy_weekend_sat = true
occupancy_start_time = 06:00
occupancy_end_time = 18:00
occupancy_sat_end_time = 14:00

; Startup/Shutdown flags
create_startup_shutdown_flags = false
startup_hours = 1.0
shutdown_hours = 1.0

; Holiday support (optional)
holiday_csv = 

; Modulation-based occupancy
enable_modulation_based_occupancy = false
modulation_threshold_active = 0.3
use_supply_modulation = true
use_return_modulation = true
combine_logic = OR

; Setpoint error features
create_setpoint_error = true
create_efficiency_proxy = false
setpoint_tolerance_degC = 0.5
; Deadband: differences |e| <= this are zeroed (reduces false positives from noise)
setpoint_error_deadband_degC = 0.3

; Cyclic time encoding (ENABLED - CRITICAL FIX for neural network learning)
create_cyclic_time_encoding = true
create_cyclic_hour = true
create_cyclic_day_of_week = true
create_cyclic_month = false
create_cyclic_day_of_year = false

; Raw time features
create_hour_of_day = true
create_day_of_week = false
create_is_weekend = true

; Season progress (DISABLED - zero variance in single season)
create_season_progress = false

; Rolling features
create_outdoor_temp_rolling_3h = true
create_outdoor_temp_rolling_24h = true

; Interaction features (DISABLED for unsupervised)
create_interaction_features = false
create_temp_occupancy_interactions = false
create_temp_time_interactions = false
create_temp_weekend_interaction = false
create_temp_inertia = false

; Advanced features (ENABLED for thermal_power_signed - critical for HVAC analysis)
create_advanced_control_features = true
create_rate_of_change_features = false
; Differencing features: first differences (hunting / oscillation indicator, Salsbury 2014)
; Creates d_Temperatura_Mandata and d_Modulazione_Ventilatore_Mandata columns in features CSV
; Set to true to include in output CSV (they are NOT in LSTM feature lists unless you add them)
create_differencing_features = true
differencing_columns = Temperatura Mandata, Modulazione Ventilatore Mandata
create_lag_features = false
lag_variables = Temperatura Esterna, Modulazione Ventilatore Mandata
lag_steps = 1, 2, 3, 6, 12

; Output settings
save_features_csv = true
save_full_precision = true
features_output_suffix = _features


; =============================================================================
; CORRELATION MATRIX ANALYSIS
; =============================================================================
; Read by 13.correlation_matrix_analysis.py via:  corr_section = 'correlation_matrix'
[correlation_matrix]
enable_correlation_matrix = true

; Correlation methods
calculate_pearson = true
calculate_spearman = true
calculate_kendall = false

;  TEMPORAL AGGREGATION (thesis-grade statistical rigor) 
; Raw 30-min data is autocorrelated  violates independence assumption.
; Aggregating to hourly means before computing correlations makes p-values valid.
apply_temporal_aggregation = true
aggregation_frequency = 1H   ; '1H' = hourly, 'D' = daily
aggregation_method = mean    ; 'mean' or 'median'
; Filter to steady-state periods only (requires is_steady_state column in CSV)
filter_steady_state = false
steady_state_column = is_steady_state

; Selected features for analysis
correlation_columns = Temperatura Ripresa, Temperatura Mandata, Temperatura Saturazione, Modulazione Ventilatore Ripresa, Modulazione Ventilatore Mandata, Temperatura Esterna, Umidita Esterna, outdoor_temp_rolling_3h, thermal_power_signed, day_of_week

; Visualization settings
create_correlation_heatmaps = true
show_upper_triangle_only = true
highlight_threshold = 0.7
highlight_color = lime
heatmap_colormap = coolwarm
annotate_values = true
annotation_fontsize = 9

; Analysis settings
identify_strong_correlations = true
strong_correlation_threshold = 0.7
identify_weak_correlations = true
weak_correlation_threshold = 0.3
detect_multicollinearity = true
multicollinearity_threshold = 0.9

; Report settings
generate_correlation_report = true
top_n_correlations = 10
report_positive_correlations = true
report_negative_correlations = true

; Output settings
save_correlation_matrices_csv = true
save_top_correlations_csv = true
create_word_report = true

; Figure settings
heatmap_figure_width = 18
heatmap_figure_height = 16
heatmap_font_scale = 1.0
correlation_plot_format = png
correlation_plot_dpi = 300

; Data quality thresholds
min_data_coverage = 0.7
drop_zero_variance = true

; Statistical significance
compute_pvalues = false
fdr_correction = false
significance_level = 0.05

; Performance settings
max_rows_for_kendall = 5000

; =============================================================================
; DEEP LEARNING - LSTM MODELS
; =============================================================================

; =============================================================================
; UNSUPERVISED LSTM AUTOENCODER - ANOMALY DETECTION
; =============================================================================
;  PRIMARY MODEL - Unsupervised Learning (No Target Variable)
; Purpose: Learn normal HVAC operation patterns and detect anomalies
; Architecture: LSTM Encoder-Decoder for reconstruction-based learning
; Input = Output (reconstructs the same sequence)
; =============================================================================
[lstm_autoencoder]
enable_autoencoder = true

; Sequence length: 8 steps x 30 min = 4 hours
; Optuna searched: 8, 16, 24, 48 steps — converged on 8 for both Summer 2025 and Winter 2026.
; (trial #17, val_loss=0.041324 for Summer; Winter Optuna also returned 8)
; 48 steps (24h) kept as comment for comparison experiments:
;   sequence_length = 48
sequence_length = 8

; Regime-shift / shoulder-season guard: caps dataset at this date BEFORE the 70/15/15 split.
; ONLY applied when season = Summer  automatically ignored for Winter (no shoulder tail).
; Summer 2025 full range: Jul 9 – Oct 14, 2025 (no cap — Optuna tuner uses the complete dataset)
; To re-enable shoulder-season guard, set e.g.: dataset_end_date = 2025-09-30
dataset_end_date =

; Split strategy:
;   chronological    = first 70% train, next 15% val, last 15% test (default)
;                      Risk: test set falls entirely in autumn (shoulder season) → 9× higher
;                      test error, 88% false-positive anomaly rate.
;   stratified_weekly = every 7th week is test (wk 3,10,17,...), every 7th offset-1 is val,
;                       remaining weeks are training. All splits cover all seasons equally.
;                       Fixes the regime-shift problem without needing dataset_end_date.
split_strategy = stratified_weekly

; Chronological split ratios (only used when split_strategy = chronological)
train_split = 0.70
val_split   = 0.15

; Features to reconstruct (NO target variable - unsupervised)
; The correct feature list is selected AUTOMATICALLY based on [global] season.
;
; SUMMER: Supply setpoint (Set Points Temperatura Mandata) varies with weather compensation.
; WINTER: Compensated heating setpoint (Set Points Temperatura Compensata) varies with outdoor temp.
; thermal_power_signed = fan_modulation x (T_mandata - T_ripresa)
;   Best single HVAC health metric: detects when fan runs but no energy is transferred.
;
; REMOVED: Set Points Temperatura Mandata  constant 21degC for entire season  zero variance
;  RobustScaler range collapses  R^2=0.000  corrupts gradients
;
; WEATHER COLUMNS (Temperatura Esterna, Umidita Esterna) REMOVED from reconstruction targets.
; Reason: weather is an *exogenous disturbance*.  The model never sees test-set outdoor temps
; during training (summer train  23degC mean  test  15degC mean, min 6degC), so reconstruction
; error on weather dominates and causes 100% false-positive anomaly rates.
; Keep only HVAC-internal variables  the model scores "is the AHU behaving correctly
; given whatever the weather is doing", not "did the weather change".
;
; OPTION A (regime-invariant signals  active):
;   thermal_power_signed removed: it equals delta_t_signed x fan_mod, so when building load
;   changes in shoulder season the raw product shifts ~50% even on a healthy AHU.
;   setpoint_error REMOVED (same as winter): median~0, +/-large tails  RMSE ~173%, flat train distribution.
;     Apply as rule-based check: rolling_mean(setpoint_error, 4h).abs() > 1.5degC  control fault.
;   delta_t_signed REMOVED: it equals TM  TR exactly  mathematically redundant given F1+F2.
;     Independent Dense output head cannot enforce that constraint  wastes model capacity.
;     Apply as rule-based check: delta_t_signed < 0.5degC during Mod>30%  heat-transfer fault.
;   Modulation kept: gives the AE fan-state context so it learns ON/OFF TM/TR profiles correctly.
;    NOTE: if Modulazione is constant in a given dataset (e.g. locked at 100%), the auto-drop
;         variance filter in 3_preprocessor.py will remove it automatically at runtime.
;         No need to edit this list manually  the pipeline self-corrects.
; SUMMER: 4-feature experimental set (Mod.Mandata added as per manager request)
;   TM   primary control output, always dynamic
;   TR   building return, captures thermal load
;   TS   coil saturation: divergence from TM signals heat-transfer fault
;   Mod  Mandata fan modulation — EXPERIMENTAL: bang-bang 60↔80%, r=-0.07 with TM
;        Monitor: if feature_error_metrics.png shows Mod dominates reconstruction error,
;        drop it and revert to 3-feature set. Ripresa excluded (r=1.00 with Mandata).
features_summer = Temperatura Mandata,Temperatura Ripresa,Temperatura Saturazione,Modulazione Ventilatore Mandata
;
; WINTER: stable 3-feature set — Modulazione excluded because it is fully constant
; at 80% from late Nov 2025 onwards (zero variance → zero information for anomaly detection).
features_winter = Temperatura Mandata,Temperatura Ripresa,Temperatura Saturazione
; robust uses median+IQR  feature near-constant in training doesn't get wrong [0,1] mapping
; minmax  if setpoint_error0 in summer, scaler maps tiny range to [0,1]  breaks in autumn
scaler_type = robust

; Training hyperparameters
epochs = 300
; Optuna best: trial #17
batch_size = 16
learning_rate = 0.001
; mae is more robust than mse when features include near-constant signals (binary fan)
loss_function = mae

; Autoencoder architecture
; Rule: encoder/decoder = 4-8x features, bottleneck = ~2x features
; summer: 3 features (TM, TR, Mod)   delta_t and setpoint_error are rule-based
; winter: 3 features (TM, TR, Mod)   delta_t and setpoint_error are rule-based
; Optuna best Winter 2026: trial #17  (enc=128, bot=16, dec=128, dropout=0.0)
encoder_units = 128
bottleneck_units = 16
decoder_units = 128
; Dropout: 0.0 (Optuna best — no dropout for this 3-feature dataset)
dropout = 0.0

; Early stopping  long enough for gradual LR schedule to finish
early_stopping_patience = 50

; -----------------------------------------------------------------------------
; LEARNING RATE SCHEDULER (Dynamic Optimization)
; -----------------------------------------------------------------------------
; ReduceLROnPlateau: Automatically reduces learning rate when training plateaus
; This helps the model fine-tune itself to find optimal weights
;
; How it works:
;   1. Starts with 'learning_rate' (e.g., 0.001)
;   2. If val_loss doesn't improve for 'lr_reduce_patience' epochs...
;   3. ...multiply learning_rate by 'lr_reduce_factor' (e.g., 0.001  0.0005)
;   4. Continue until reaching 'lr_min'
;
; Benefits:
;    No manual tuning needed
;    Model automatically fine-tunes when stuck
;    Finds better minima than fixed learning rate
;    Industry best practice for deep learning
;
; Example progression:
;   Epoch 1-20:  LR = 0.001 (fast learning)
;   Epoch 21-40: LR = 0.0005 (plateaued, reduced)
;   Epoch 41-60: LR = 0.00025 (further refinement)
;   Epoch 61+:   LR = 0.000125 or min_lr (fine-tuning)
; -----------------------------------------------------------------------------

; How much to reduce LR when plateau detected (multiply by this factor)
; 0.7 = gentle reduction (was 0.5  too aggressive, caused LR to floor by epoch 45)
lr_reduce_factor = 0.7

; How many epochs to wait before reducing LR (if no improvement)
; 15 = give model time to escape local minima before cutting LR (was 5  too aggressive)
lr_reduce_patience = 15

; Minimum learning rate (don't go below this)
; 0.00005 keeps more room to learn in later epochs (was 0.00001  too low)
lr_min = 0.00005

; -----------------------------------------------------------------------------
; ANOMALY DETECTION THRESHOLD MODE
; -----------------------------------------------------------------------------
; threshold_mode options:
;   - 'percentile' : static threshold anchored to training set (catches slow degradation)
;   - 'ema'        : DYNAMIC threshold EMA(test_errors) + k*EMA_std
;   - 'std_dev'    : static threshold from mean + k*sigma of training errors
;   - 'manual'     : use fixed threshold values defined below
threshold_mode = ema

; EMA parameters (used when threshold_mode = ema)
; ema_span: smaller = EMA reacts faster; span=10 gives ~5h memory at 30-min sampling
ema_span = 10

; SEASON-SPECIFIC sigma multipliers (auto-selected based on [global] season).
; These override ema_sigma_multiplier when the matching season key is found.
;
; Quick presets (choose ONE):
;   BALANCED (active): fewer borderline FPs, still detects short bursts
;   CONSERVATIVE:       very low FP risk, may miss subtle anomalies
;
; --- BALANCED (ACTIVE) ---
ema_sigma_multiplier_summer = 1.2
ema_sigma_multiplier_winter = 1.2
;
; --- CONSERVATIVE (manual switch) ---
; ema_sigma_multiplier_summer = 1.5
; ema_sigma_multiplier_winter = 1.5

; Generic fallback (used if no season-specific key is found above)
ema_sigma_multiplier = 1.5

; PERCENTILE MODE — threshold from TRAINING errors (used when threshold_mode = percentile)
; 95.0 = top 5% of training error tail (more sensitive)
; 99.5 = minimal false positives, may miss subtle faults
anomaly_threshold_percentile = 95.0

; MANUAL MODE (used when threshold_mode = manual)
manual_threshold_mse = 0.01
manual_threshold_rmse = 0.1
manual_threshold_mae = 0.05

; -----------------------------------------------------------------------------
; ANOMALY FILTERING & SEVERITY CLASSIFICATION
; -----------------------------------------------------------------------------
; Filter out false positives and (optionally) classify anomaly severity.

; Minimum features that must be anomalous to confirm an anomaly
min_anomalous_features = 1

; Severity classification  set enable_severity = false to output only Anomaly/Normal
enable_severity = false

; Severity thresholds (multiplier of base threshold)
critical_severity_multiplier = 2.5
moderate_severity_multiplier = 1.5

; Feature importance weights  auto-selected by season (same logic as features above)
critical_features_summer = Temperatura Mandata, Temperatura Saturazione
critical_features_winter = Temperatura Mandata, Temperatura Saturazione

; Report only critical + moderate anomalies (ignore minor)
report_minor_anomalies = false

; Persistence filter: require N consecutive anomalous windows before flagging.
; BALANCED (active): 4 windows  (~2h at 30-min sampling)
; CONSERVATIVE:      5 windows  (~2.5h)
min_consecutive_anomaly_windows = 4

; Anomaly context plotting window (9_plot_anomaly_context.py)
context_hours_before = 72
context_hours_after = 72
zoom_hours = 6
enable_residual_panels = true

; Shoulder-season transition false-positive mitigation:
; suppress only when BOTH conditions hold:
;   1) TM is in a steep transition (|dTM/dt| above threshold per 30-min step)
;   2) TR remains stable (TR feature-error below training percentile threshold)
enable_transition_tr_guard_filter = true
transition_tm_column = Temperatura Mandata
transition_tr_column = Temperatura Ripresa
transition_tm_roc_threshold = 1.5
tr_stability_error_percentile = 99.0

; Semantic filter layer: classify anomalies as operational peaks vs potential faults.
; strict mode keeps only: non-periodic + physics-breaking anomalies.
enable_operational_fault_filter = true
fault_filter_strict_mode = true
semantic_ts_column = Temperatura Saturazione
event_merge_gap_hours = 1.0
event_start_min_len = 3
event_end_len = 2

; Optional schedule-aware threshold scaling (simple mode separation).
; Effective threshold = base_threshold × multiplier(mode).
enable_mode_aware_threshold = false
occupied_start_hour = 8
occupied_end_hour = 18
occupied_include_weekends = false
occupied_threshold_multiplier = 0.95
unoccupied_threshold_multiplier = 1.05

; Periodicity suppression (operational cycles)
periodicity_hours = 24
periodicity_tolerance_hours = 1.0
periodicity_error_ratio_tolerance = 0.5

; Physics-breaking criteria (fault-like signatures)
physics_tm_ts_divergence_degC = 2.0
physics_tm_ramp_min_degC_per_step = 1.0
physics_tr_response_min_degC_per_step = 0.25

; EMA warm-start grace period: skip anomaly flagging for the first N windows
; of the test set while the EMA stabilizes (only applies when threshold_mode = ema).
; Recommended: span × 2 (e.g., span=10 → grace=20 windows ≈ 10 hours at 30-min resolution).
ema_grace_period_windows = 20

; EMA gap-reset (optional): if the test timeline has large timestamp jumps
; (holiday shutdowns, stratified test blocks), reset the EMA warm-start to the
; training anchor at each new block so the threshold doesn't carry a stale baseline.
ema_reset_after_gap = true
ema_reset_gap_hours = 3.0

; =============================================================================
; OPTUNA HYPERPARAMETER OPTIMIZATION
; =============================================================================
; Run:  python 10_optuna_tuner.py
; After completion, copy the printed best values into [lstm_autoencoder] above.
; The SQLite study is resumable — re-run if interrupted (load_if_exists=True).

; -----------------------------------------------------------------------------
; CLEAN TRAINING FILTERS (control what gets excluded from training)
; -----------------------------------------------------------------------------
; Clean training mask  must be TRUE to honour require_active_operation and other filters
enable_clean_training_filters = true

; Raw-data flatline exclusion (before scaling, in data_loader)
exclude_raw_flatline_periods = false
raw_flatline_window = 12
raw_flatline_std_threshold = 0.05
raw_flatline_min_samples = 24

; Exclude sequences where the system is off (fan modulation near zero)
require_active_operation = true
; Exclude explicit interpolation-flag columns (requires _interpolated marker columns in CSV)
exclude_interpolated_periods = false
; Auto-exclude long flat-line periods (data gaps filled by interpolation)
max_interpolation_gap_hours = 4.0
sampling_interval_minutes = 30
exclude_out_of_range = true
exclude_high_variance = false

; (A) TRANSIENT MASKING after setpoint / fan-modulation switch events (Schein)
mask_switch_transients = false
switch_sp_threshold_degC = 0.5
switch_mod_threshold_pct = 10.0
switch_mask_steps = 2

; (B) EWMA SMOOTHING on sensor channels only (Schein)
apply_ewma_smoothing = true
ewma_span = 3
ewma_sensor_columns = Temperatura Mandata, Temperatura Ripresa, Temperatura Saturazione

; (C) DEADBAND on setpoint_error in LSTM pipeline (Salsbury)
setpoint_error_deadband_degC = 0.3

; (E) MAD-BASED EXTREME WINDOW FILTER (Wei / 2-sigma clean-training idea)
apply_mad_training_filter = true
mad_exclusion_pct = 5.0

; Output settings
save_model = true
generate_plots = true
plot_dpi = 300

; Model versioning
version_tag = v2_ewma_bottleneck32_lr001

[optuna]
; Total number of trials (rule of thumb: ~6× number of hyperparameters)
n_trials = 30

; Epochs per trial — keep low so search is fast; best model trains with full epochs
trial_epochs = 60

; Early stopping patience per trial (pruner also kills bad trials mid-run)
trial_patience = 15

; Search space — comma-separated candidate values
search_encoder_units    = 32, 64, 128
search_bottleneck_units = 8, 16, 32
search_dropout          = 0.0, 0.1, 0.2, 0.3
search_learning_rate    = 0.0001, 0.0005, 0.001
search_batch_size       = 16, 32, 64
search_sequence_length  = 8, 16, 24, 48

; AUTO-GENERATED from [global] building_id + ahu_unit + season + year
; e.g. C1_UTA1_Summer2025  — changes automatically when you change the 4 global variables
